<!--01 Writing Hello World using React with javascript code in seperate file -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Document</title>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js" type="module"></script>

  <!-- //The order of the script tags is important. The React and ReactDOM libraries must be loaded before your app.js file, as your code depends on them. If you load app.js first, it will throw an error because React and ReactDOM won't be defined yet. -->
</body>
</html>
